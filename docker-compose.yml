services:
  postgres:
    build: ./docker
    container_name: madras-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: madras_menu_local
    ports:
      # Host 5433 -> container 5432, so this never conflicts with
      # Postgres.app (which still owns 5432 if it's running).
      - "5433:5432"
    volumes:
      # Named volume, managed by Docker itself — not a path on the laptop's
      # own filesystem — which is the thing actually worth testing against
      # the "Postgres.app is extremely slow" complaint.
      - madras_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Applies pending Alembic migrations once, then exits. The backend waits
  # for it to succeed, so it never starts against an unmigrated database.
  migrate:
    build: .
    container_name: madras-migrate
    env_file:
      - .env.local
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: .
    container_name: madras-backend
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      # invoice PDFs; a named volume so they survive rebuilds
      - madras_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  madras_pgdata:
  madras_storage:
